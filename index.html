<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Courier Barcode Scanner V0.1</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px #0001}h1{font-size:24px;margin:0 0 6px}.sub{color:#666;margin-bottom:20px}button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;font-size:18px;font-weight:700;background:#1769aa;color:white}button.secondary{background:#666}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bbb;border-radius:9px;font-size:18px}.result{margin-top:14px;padding:14px;background:#eef6ff;border-radius:9px;word-break:break-all}video{width:100%;margin-top:12px;border-radius:10px;background:#111;min-height:220px}small{color:#666}.ok{color:#137333;font-weight:700}.err{color:#b3261e;font-weight:700}</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Courier Barcode Scanner</h1><div class="sub">V0.1 - SF / DHL / FedEx barcode test</div>
<label>Tracking Number</label><input id="tracking" placeholder="Scanned value will appear here">
<button id="start">SCAN BARCODE</button><button id="stop" class="secondary" style="display:none">STOP CAMERA</button>
<video id="video" playsinline></video>
<div class="result"><div><strong>Result:</strong> <span id="result">Not scanned yet</span></div><div style="margin-top:8px"><strong>Format:</strong> <span id="format">-</span></div><div style="margin-top:8px"><strong>Status:</strong> <span id="status">Ready</span></div></div>
<p><small>POC only. This page reads a barcode locally in the browser and does not save or upload the result.</small></p>
</div></div>
<script>
const v=document.getElementById('video'), start=document.getElementById('start'), stop=document.getElementById('stop');
const result=document.getElementById('result'), format=document.getElementById('format'), status=document.getElementById('status'), tracking=document.getElementById('tracking');
let stream=null, running=false;
function setStatus(t,cls=''){status.textContent=t;status.className=cls}
async function stopCam(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;start.style.display='block';stop.style.display='none'}
async function scanLoop(detector){while(running){try{const codes=await detector.detect(v);if(codes.length){const c=codes[0];tracking.value=c.rawValue;result.textContent=c.rawValue;format.textContent=c.format||'Unknown';setStatus('Barcode captured','ok');await stopCam();return}}catch(e){} await new Promise(r=>setTimeout(r,250));}}
start.onclick=async()=>{if(!('BarcodeDetector' in window)){setStatus('BarcodeDetector is not supported by this Chrome/device. Use the manual field or test a ZXing hosted version.','err');return}try{setStatus('Requesting camera...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;await v.play();running=true;start.style.display='none';stop.style.display='block';const formats=await BarcodeDetector.getSupportedFormats();const wanted=['code_128','code_39','ean_13','ean_8','itf','qr_code','data_matrix'].filter(x=>formats.includes(x));const detector=new BarcodeDetector(wanted.length?{formats:wanted}:undefined);setStatus('Scanning...');scanLoop(detector)}catch(e){setStatus('Camera unavailable: '+e.message,'err')}};
stop.onclick=()=>{stopCam();setStatus('Stopped')};
</script></body></html>
