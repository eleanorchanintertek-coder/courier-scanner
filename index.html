<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minimal Receiving V0.5</title>
<style>
:root{--blue:#087bb8;--green:#17823b;--bg:#f4f6f8;--muted:#667085;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#202124}.wrap{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000014}h1{margin:0;font-size:25px}.sub{color:var(--muted);margin:4px 0 18px}.summary{text-align:center;background:#eef6ff;border-radius:12px;padding:12px;margin-bottom:18px}.summary b{font-size:25px;display:block;margin-top:2px}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;padding:14px;border:1px solid #b9c0c7;border-radius:9px;font-size:18px}button{width:100%;border:0;border-radius:10px;padding:15px;margin-top:10px;font-size:17px;font-weight:700;color:white;background:var(--blue)}button.save{background:var(--green);font-size:19px}.secondary{background:#69737d}.camera{display:none;width:100%;min-height:180px;background:#111;border-radius:10px;margin-top:10px}.preview{display:none;width:100%;max-height:300px;object-fit:contain;background:#111;border-radius:10px;margin-top:10px}.auto{background:#f6f8fa;padding:12px;border-radius:9px}.status{padding:12px;margin-top:14px;background:#eef6ff;border-radius:9px}.success{display:none;background:#e8f5ec;color:#166534;padding:14px;margin-top:14px;border-radius:10px}.error{color:var(--red);font-weight:700}.hint{font-size:13px;color:var(--muted);margin-top:6px}.hidden{display:none!important}</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Sample Receiving</h1><div class="sub">Minimal Receiving V0.5 POC</div>
<div class="summary">Today's Received<b id="count">0</b></div>
<label>1. Sample ID *</label>
<input id="sample" placeholder="S600713437" autocapitalize="characters" autocomplete="off">
<button id="scanSample">SCAN SAMPLE ID</button>
<label>2. Courier No. <span class="hint">(Optional)</span></label>
<input id="courier" placeholder="Scan or enter courier number" autocapitalize="characters" autocomplete="off">
<button id="scanCourier">SCAN COURIER NO.</button>
<button id="stopScan" class="secondary hidden">STOP CAMERA</button>
<video id="video" class="camera" playsinline></video>
<label>3. Receiving Photo *</label>
<input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
<button id="takePhoto">TAKE PHOTO</button>
<img id="preview" class="preview" alt="Photo preview">
<div id="photoState" class="hint">No photo selected.</div>
<label>Received Time</label><div id="time" class="auto">Will be set automatically</div>
<div id="status" class="status">Ready</div>
<button id="save" class="save">SAVE RECORD</button>
<div id="success" class="success"></div>
<button id="next" class="secondary hidden">NEXT SAMPLE</button>
<p class="hint">POC only. SAVE currently stores the text record locally on this browser. The photo is previewed only and is not uploaded to SharePoint yet.</p>
</div></div>
<script>
const $=id=>document.getElementById(id),STORE='minimalReceivingV05';let received=null,stream=null,running=false,scanTarget=null;
function clean(v){return v.trim().replace(/\s+/g,'').toUpperCase()}
function records(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return[]}}
function setRecords(x){localStorage.setItem(STORE,JSON.stringify(x));$('count').textContent=x.filter(r=>r.date===dateKey()).length}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function setTime(){if(!received){received=new Date();$('time').textContent=received.toLocaleString()}}
$('sample').addEventListener('input',()=>{if($('sample').value.trim())setTime()});$('sample').addEventListener('blur',()=>{$('sample').value=clean($('sample').value)});$('courier').addEventListener('blur',()=>{$('courier').value=clean($('courier').value)});
$('takePhoto').onclick=()=>$('photo').click();$('photo').onchange=()=>{const f=$('photo').files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').style.display='block';$('photoState').textContent='Photo ready: '+clean($('sample').value||'SAMPLE')+'.jpg (preview only)'};
async function stopCam(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').style.display='none';$('stopScan').classList.add('hidden')}
async function loop(det){while(running){try{const c=await det.detect($('video'));if(c.length){const value=clean(c[0].rawValue);$(scanTarget).value=value;if(scanTarget==='sample')setTime();$('status').textContent='Barcode captured: '+value;await stopCam();return}}catch(e){}await new Promise(r=>setTimeout(r,250))}}
async function startScan(target){scanTarget=target;if(!('BarcodeDetector'in window)){$('status').innerHTML='<span class="error">Barcode scanning is not supported on this browser. Please enter manually.</span>';$(target).focus();return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('video').style.display='block';$('stopScan').classList.remove('hidden');await $('video').play();running=true;const sup=await BarcodeDetector.getSupportedFormats(),pref=['code_128','code_39','ean_13','ean_8','itf','qr_code','data_matrix'].filter(x=>sup.includes(x));const det=pref.length?new BarcodeDetector({formats:pref}):new BarcodeDetector();$('status').textContent='Scanning '+(target==='sample'?'Sample ID':'Courier No.')+'...';loop(det)}catch(e){$('status').innerHTML='<span class="error">Camera unavailable: '+e.message+'</span>'}}
$('scanSample').onclick=()=>startScan('sample');$('scanCourier').onclick=()=>startScan('courier');$('stopScan').onclick=stopCam;
$('save').onclick=()=>{const sample=clean($('sample').value),courier=clean($('courier').value);if(!sample){$('status').innerHTML='<span class="error">Sample ID is required.</span>';return}if(!/^S\d+$/i.test(sample)){$('status').innerHTML='<span class="error">Sample ID should look like S600713437.</span>';return}if(!$('photo').files.length){$('status').innerHTML='<span class="error">Receiving photo is required.</span>';return}setTime();const all=records();if(all.some(r=>r.sampleId===sample)){if(!confirm(sample+' already exists on this device. Add another record anyway?'))return}const rec={sampleId:sample,courierNo:courier,date:dateKey(received),receivedTime:received.toISOString(),photoName:sample+'.jpg'};all.push(rec);setRecords(all);$('success').style.display='block';$('success').innerHTML='<strong>SAVED TO LOCAL POC</strong><br>'+sample+'<br>'+received.toLocaleString()+'<br>Planned photo name: '+rec.photoName+'<br><small>Not yet saved to SharePoint.</small>';$('next').classList.remove('hidden');$('save').classList.add('hidden');$('status').textContent='Record captured locally'};
$('next').onclick=()=>{$('sample').value='';$('courier').value='';$('photo').value='';$('preview').src='';$('preview').style.display='none';$('photoState').textContent='No photo selected.';$('time').textContent='Will be set automatically';received=null;$('success').style.display='none';$('next').classList.add('hidden');$('save').classList.remove('hidden');$('status').textContent='Ready';$('sample').focus();window.scrollTo({top:0,behavior:'smooth'})};
setRecords(records());
</script></body></html>
