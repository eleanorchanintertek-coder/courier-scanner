<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sample Receiving V0.2</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px #00000015}h1{font-size:24px;margin:0 0 5px}.sub{color:#666;margin-bottom:22px}label{display:block;margin-top:14px;margin-bottom:6px;font-weight:bold}input,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bbb;border-radius:9px;font-size:18px}button{width:100%;padding:16px;margin-top:12px;border:0;border-radius:10px;font-size:18px;font-weight:bold;background:#0078b9;color:#fff}button.secondary{background:#666}button.confirm{background:#188038}video{width:100%;margin-top:12px;border-radius:10px;background:#111;min-height:220px}.info{margin-top:16px;background:#eef6ff;border-radius:10px;padding:14px}.success{margin-top:16px;padding:14px;background:#e6f4ea;color:#137333;border-radius:10px;display:none}.error{color:#b3261e;font-weight:bold}.small{color:#666;font-size:13px;margin-top:18px}.hidden{display:none}</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Sample Receiving</h1><div class="sub">V0.2 - Tracking Capture Test</div>
<label for="tracking">Tracking Number</label>
<input id="tracking" type="text" placeholder="Scan or enter tracking number" autocomplete="off" autocapitalize="characters">
<button id="scanButton">SCAN BARCODE</button>
<button id="stopButton" class="secondary hidden">STOP CAMERA</button>
<video id="video" playsinline></video>
<label for="courier">Courier</label>
<select id="courier"><option value="">Select courier</option><option>SF Express</option><option>DHL</option><option>FedEx</option><option>UPS</option><option>Morning Express</option><option>Other</option></select>
<div class="info"><strong>Detected / Entered:</strong><div style="margin-top:8px">Tracking: <span id="result">-</span></div><div style="margin-top:6px">Courier: <span id="detectedCourier">-</span></div><div style="margin-top:6px">Status: <span id="status">Ready</span></div></div>
<button id="confirmButton" class="confirm">CONFIRM</button>
<div id="confirmed" class="success"></div>
<div class="small">POC only. No tracking number or other data is uploaded or saved.</div>
</div></div>
<script>
const tracking=document.getElementById('tracking'),courier=document.getElementById('courier'),result=document.getElementById('result'),detectedCourier=document.getElementById('detectedCourier'),status=document.getElementById('status'),video=document.getElementById('video'),scanButton=document.getElementById('scanButton'),stopButton=document.getElementById('stopButton'),confirmButton=document.getElementById('confirmButton'),confirmed=document.getElementById('confirmed');let stream=null,running=false;
function cleanTrackingNumber(v){return v.trim().replace(/\s+/g,'').toUpperCase()}
function detectCourier(n){n=cleanTrackingNumber(n);if(n.startsWith('SF'))return'SF Express';if(n.startsWith('1Z'))return'UPS';if(n.startsWith('MEC'))return'Morning Express';if(/^\d{10}$/.test(n))return'DHL';if(/^\d{12}$/.test(n))return'FedEx';return''}
function updateTracking(){const v=cleanTrackingNumber(tracking.value);result.textContent=v||'-';const d=detectCourier(v);if(d){courier.value=d;detectedCourier.textContent=d}else detectedCourier.textContent=courier.value||'-';confirmed.style.display='none'}
tracking.addEventListener('input',updateTracking);tracking.addEventListener('blur',()=>{tracking.value=cleanTrackingNumber(tracking.value);updateTracking()});courier.addEventListener('change',()=>{detectedCourier.textContent=courier.value||'-';confirmed.style.display='none'});
async function stopCamera(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;scanButton.classList.remove('hidden');stopButton.classList.add('hidden')}
async function scanLoop(detector){while(running){try{const codes=await detector.detect(video);if(codes.length){tracking.value=cleanTrackingNumber(codes[0].rawValue);updateTracking();status.textContent='Barcode captured';await stopCamera();return}}catch(e){}await new Promise(r=>setTimeout(r,250))}}
scanButton.addEventListener('click',async()=>{if(!('BarcodeDetector'in window)){status.innerHTML='<span class="error">Barcode scanning is not supported on this browser. Please enter the tracking number manually.</span>';tracking.focus();return}try{status.textContent='Opening camera...';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();running=true;scanButton.classList.add('hidden');stopButton.classList.remove('hidden');const supported=await BarcodeDetector.getSupportedFormats();const preferred=['code_128','code_39','ean_13','ean_8','itf','qr_code','data_matrix'].filter(f=>supported.includes(f));const detector=preferred.length?new BarcodeDetector({formats:preferred}):new BarcodeDetector();status.textContent='Scanning...';scanLoop(detector)}catch(e){status.innerHTML='<span class="error">Camera unavailable: '+e.message+'</span>'}});
stopButton.addEventListener('click',async()=>{await stopCamera();status.textContent='Camera stopped'});
confirmButton.addEventListener('click',()=>{const n=cleanTrackingNumber(tracking.value),c=courier.value;if(!n){status.innerHTML='<span class="error">Please enter or scan a tracking number.</span>';tracking.focus();return}if(!c){status.innerHTML='<span class="error">Please select a courier.</span>';courier.focus();return}tracking.value=n;result.textContent=n;confirmed.innerHTML='<strong>Confirmed</strong><br><br>Tracking: '+n+'<br>Courier: '+c;confirmed.style.display='block';status.textContent='Tracking confirmed'});
</script></body></html>
