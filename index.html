<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sample Receiving V0.3</title>
<style>
:root{--blue:#087bb8;--green:#17823b;--bg:#f4f6f8;--line:#d7dce1;--muted:#667085;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#202124}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000014}h1{margin:0 0 4px;font-size:25px}.sub{color:var(--muted);margin-bottom:20px}label{display:block;font-weight:700;margin:15px 0 6px}input,select{width:100%;padding:14px;border:1px solid #b9c0c7;border-radius:9px;font-size:17px;background:#fff}button{border:0;border-radius:10px;font-size:17px;font-weight:700;padding:14px;cursor:pointer}.wide{width:100%;margin-top:10px}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.gray{background:#68727d;color:#fff}.qty{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}.qty button{font-size:24px;background:#e8eef3}.qty input{text-align:center;font-weight:700}.auto{background:#f6f8fa;border:1px solid var(--line);padding:12px;border-radius:9px}.camera{width:100%;min-height:180px;background:#111;border-radius:10px;margin-top:10px;display:none}.photo-preview{width:100%;max-height:260px;object-fit:contain;background:#111;border-radius:10px;margin-top:10px;display:none}.hint{font-size:13px;color:var(--muted);margin-top:6px}.status{margin-top:14px;padding:12px;background:#eef6ff;border-radius:9px}.error{color:var(--red);font-weight:700}.review{display:none;margin-top:18px;border-top:2px solid #e7ebef;padding-top:16px}.review-grid{display:grid;grid-template-columns:42% 58%;gap:8px 5px;font-size:15px}.review-grid div:nth-child(odd){font-weight:700}.final{display:none;margin-top:16px;padding:14px;border-radius:10px;background:#e8f5ec;color:#166534}.warning{margin-top:8px;font-weight:700;color:#8a4b00}.hidden{display:none!important}small{color:var(--muted)}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Sample Receiving</h1><div class="sub">V0.3 - Receiving Form POC</div>
<label>Tracking Number *</label><input id="tracking" placeholder="Scan or enter tracking number" autocapitalize="characters" autocomplete="off">
<button id="scanBtn" class="wide blue">SCAN BARCODE</button><button id="stopScan" class="wide gray hidden">STOP CAMERA</button><video id="video" class="camera" playsinline></video>
<label>Courier *</label><select id="courier"><option value="">Select courier</option><option>SF Express</option><option>DHL</option><option>FedEx</option><option>UPS</option><option>Morning Express</option><option>Other</option></select>
<label>CS Code / Sent To *</label><input id="cs" placeholder="e.g. CW">
<label>Section</label><select id="section"><option value="">Select section</option><option>CSTOYS</option><option>BD</option><option>CS</option><option>CSHG</option><option>Food</option><option>CSTS</option><option>E&NA</option><option>1/F</option><option>2/F</option><option>CM1</option><option>CM2</option><option>PA</option><option>Other</option></select>
<label>No. of Boxes</label><div class="qty"><button type="button" onclick="changeQty('boxes',-1)">-</button><input id="boxes" type="number" min="0" value="1"><button type="button" onclick="changeQty('boxes',1)">+</button></div>
<label>No. of Bags</label><div class="qty"><button type="button" onclick="changeQty('bags',-1)">-</button><input id="bags" type="number" min="0" value="0"><button type="button" onclick="changeQty('bags',1)">+</button></div>
<label>Company / Sender <small>(optional)</small></label><input id="sender" placeholder="Enter company / sender if needed">
<label>Parcel Received Time</label><div id="received" class="auto">Will be captured when tracking number is first entered</div>
<label>Receiving Photo *</label><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden"><button id="photoBtn" class="wide blue" type="button">TAKE PHOTO</button><img id="preview" class="photo-preview" alt="Receiving photo preview"><div id="photoStatus" class="hint">No photo captured</div>
<label>Handled By *</label><input id="handled" placeholder="Staff name / ID">
<div id="status" class="status">Ready</div>
<button id="reviewBtn" class="wide green" type="button">REVIEW RECORD</button>
<div id="review" class="review"><h2>Review Receiving Record</h2><div id="reviewGrid" class="review-grid"></div><button id="editBtn" class="wide gray" type="button">EDIT</button><button id="confirmBtn" class="wide green" type="button">CONFIRM RECEIVING RECORD</button></div>
<div id="final" class="final"><strong>POC Record Confirmed</strong><div class="warning">This record has NOT been saved to a production database.</div></div>
<p><small>POC only. No form data or photo is uploaded or saved.</small></p>
</div></div>
<script>
const $=id=>document.getElementById(id);let stream=null,running=false,receivedAt=null;
function clean(v){return v.trim().replace(/\s+/g,'').toUpperCase()}
function detect(n){n=clean(n);if(n.startsWith('SF'))return'SF Express';if(n.startsWith('1Z'))return'UPS';if(n.startsWith('MEC'))return'Morning Express';if(/^\d{10}$/.test(n))return'DHL';if(/^\d{12}$/.test(n))return'FedEx';return''}
function stamp(){if(!receivedAt){receivedAt=new Date();$('received').textContent=receivedAt.toLocaleString()}}
$('tracking').addEventListener('input',()=>{if($('tracking').value.trim())stamp();const d=detect($('tracking').value);if(d)$('courier').value=d});$('tracking').addEventListener('blur',()=>{$('tracking').value=clean($('tracking').value)});
function changeQty(id,d){const e=$(id);e.value=Math.max(0,(parseInt(e.value)||0)+d)}
$('photoBtn').onclick=()=>$('photoInput').click();$('photoInput').onchange=()=>{const f=$('photoInput').files[0];if(!f)return;const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='block';$('photoStatus').textContent='Photo captured - preview only, not uploaded'};
async function stopCam(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').style.display='none';$('scanBtn').classList.remove('hidden');$('stopScan').classList.add('hidden')}
async function loop(det){while(running){try{const c=await det.detect($('video'));if(c.length){$('tracking').value=clean(c[0].rawValue);stamp();const d=detect($('tracking').value);if(d)$('courier').value=d;$('status').textContent='Barcode captured';await stopCam();return}}catch(e){}await new Promise(r=>setTimeout(r,250))}}
$('scanBtn').onclick=async()=>{if(!('BarcodeDetector'in window)){$('status').innerHTML='<span class="error">Barcode scanning is not supported on this browser. Please enter the tracking number manually.</span>';$('tracking').focus();return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('video').style.display='block';await $('video').play();running=true;$('scanBtn').classList.add('hidden');$('stopScan').classList.remove('hidden');const sup=await BarcodeDetector.getSupportedFormats();const pref=['code_128','code_39','ean_13','ean_8','itf','qr_code','data_matrix'].filter(x=>sup.includes(x));const det=pref.length?new BarcodeDetector({formats:pref}):new BarcodeDetector();$('status').textContent='Scanning...';loop(det)}catch(e){$('status').innerHTML='<span class="error">Camera unavailable: '+e.message+'</span>'}};$('stopScan').onclick=stopCam;
function validate(){const miss=[];if(!clean($('tracking').value))miss.push('Tracking Number');if(!$('courier').value)miss.push('Courier');if(!$('cs').value.trim())miss.push('CS Code / Sent To');if(!$('handled').value.trim())miss.push('Handled By');if(!$('photoInput').files.length)miss.push('Receiving Photo');if(miss.length){$('status').innerHTML='<span class="error">Please complete: '+miss.join(', ')+'</span>';return false}return true}
$('reviewBtn').onclick=()=>{if(!validate())return;$('tracking').value=clean($('tracking').value);const rows=[['Tracking',$('tracking').value],['Courier',$('courier').value],['CS',$('cs').value.trim().toUpperCase()],['Section',$('section').value||'-'],['Boxes',$('boxes').value],['Bags',$('bags').value],['Company / Sender',$('sender').value.trim()||'-'],['Received',$('received').textContent],['Photo','Captured (POC preview only)'],['Handled By',$('handled').value.trim()]];$('reviewGrid').innerHTML=rows.map(r=>'<div>'+r[0]+'</div><div>'+r[1]+'</div>').join('');$('review').style.display='block';$('final').style.display='none';$('status').textContent='Review the record before confirming';$('review').scrollIntoView({behavior:'smooth'})};
$('editBtn').onclick=()=>{$('review').style.display='none';$('status').textContent='Edit mode'};$('confirmBtn').onclick=()=>{$('final').style.display='block';$('status').textContent='POC entry confirmed - NOT saved';$('final').scrollIntoView({behavior:'smooth'})};
</script></body></html>
